[project]
name = "rejsegaranti-recorder"
version = "0.1.0"
description = "Process 1 (Movia rejsegaranti): log Movia real-time data (Dataudveksleren), OpenWeatherMap and DMI"
authors = [{ name = "Liam Palmqvist" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# only needed for the Dataudveksleren feed (Azure Service Bus, AMQP 1.0)
siri = ["azure-servicebus>=7.11", "azure-identity>=1.15"]

[project.scripts]
rejsegaranti-recorder = "recorder.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recorder"]
